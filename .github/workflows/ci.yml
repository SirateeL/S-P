name: Étude Pipeline & Report Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Sample Test Analysis
      run: |
        python pdf_analyzer.py sample_syllabus.pdf -q "How is grading weighted?" || true

    - name: Upload HTML Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: etude-html-report
        path: output/report.html
